[project]
name = "anexa"
version = "0.1.0"
description = "Orchestration platform over a FalkorDB company graph: connections, actions, operators, schedules."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "falkordb>=1.0.9",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "croniter>=3.0",
    "mcp>=2.0",
    "anthropic>=1.15.0",
]

[project.scripts]
anexa-api = "anexa.api.main:run"
anexa-mcp = "anexa.mcp_server.server:main"
anexa-devdb = "anexa.devdb:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "fakeredis>=2.24",
    "ruff>=0.6",
    # Embedded FalkorDB: ANEXA_TEST_FALKOR_LITE=1 runs the suite on the real engine.
    "falkordblite>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anexa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
markers = [
    "falkor: needs a reachable FalkorDB server (skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
