# docker compose up --build
#   UI   http://localhost:8080
#   API  http://localhost:8000  (docs at /docs)
#   FalkorDB browser http://localhost:3000
#
# Ports are bound to 127.0.0.1. Before exposing this beyond your machine, set
# ANEXA_SECRET_KEY in a .env file next to this one (see .env.example): it
# signs logins and encrypts the stored connector credentials.

x-backend: &backend
  build: ./backend
  environment: &backend-env
    ANEXA_STORE_BACKEND: falkor
    ANEXA_FALKORDB_HOST: falkordb
    ANEXA_FALKORDB_PORT: "6379"
    # FalkorDB is a Redis server, so it doubles as the Celery broker (db 1).
    ANEXA_REDIS_URL: redis://falkordb:6379/1
    ANEXA_SECRET_KEY: ${ANEXA_SECRET_KEY:-dev-secret-change-me}
    ANEXA_ENCRYPTION_KEY: ${ANEXA_ENCRYPTION_KEY:-}
    ANEXA_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
  depends_on:
    falkordb:
      condition: service_healthy
  restart: unless-stopped

services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *backend
    command: ["celery", "-A", "anexa.worker.celery_app", "worker", "--loglevel=info"]

  beat:
    <<: *backend
    command:
      ["celery", "-A", "anexa.worker.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  falkordb-data:
